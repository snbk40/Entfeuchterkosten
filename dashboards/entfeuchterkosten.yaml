# Dashboard for Entfeuchterkosten.
#
# Paste it into a new dashboard: Settings > Dashboards > Add dashboard >
# New dashboard from scratch, open it, then the pencil > ⋮ > Raw
# configuration editor. See "Dashboard" in the README.
#
# Before pasting, replace these entity IDs with your own:
#   sensor.entfeuchter_plug_power  the power sensor of the dehumidifier
#   sensor.inverter_plug_power     the solar power sensor
# If you did not name the helper "Entfeuchter", also replace the prefix
# "sensor.entfeuchter_" of the other sensors with the name you chose.

title: Entfeuchterkosten
views:
  - title: Dehumidifier
    path: dehumidifier
    icon: mdi:air-humidifier
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Now
            icon: mdi:flash
          - type: gauge
            entity: sensor.entfeuchter_chargeable_power
            name: Chargeable power
            unit: W
            min: 0
            max: 600
            needle: true
            severity:
              green: 0
              yellow: 50
              red: 250
            grid_options:
              columns: full
          - type: tile
            entity: sensor.entfeuchter_solar_savings
            name: Solar savings
            icon: mdi:piggy-bank
            grid_options:
              columns: full
          - type: tile
            entity: sensor.entfeuchter_plug_power
            name: Dehumidifier
            icon: mdi:air-humidifier
          - type: tile
            entity: sensor.inverter_plug_power
            name: Solar
            icon: mdi:solar-power-variant
          - type: history-graph
            title: Dehumidifier vs. solar (24 h)
            hours_to_show: 24
            entities:
              - entity: sensor.entfeuchter_plug_power
                name: Dehumidifier
              - entity: sensor.inverter_plug_power
                name: Solar
              - entity: sensor.entfeuchter_chargeable_power
                name: Chargeable
              - entity: sensor.entfeuchter_solar_savings
                name: Solar savings
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Costs
            icon: mdi:cash
          - type: tile
            entity: sensor.entfeuchter_cost_today
            name: Today
            icon: mdi:calendar-today
          - type: tile
            entity: sensor.entfeuchter_cost_this_month
            name: This month
            icon: mdi:calendar-month
          - type: tile
            entity: sensor.entfeuchter_cost_this_year
            name: This year
            icon: mdi:calendar
          - type: tile
            entity: sensor.entfeuchter_total_cost
            name: Total
            icon: mdi:sigma
          - type: tile
            entity: sensor.entfeuchter_total_energy
            name: Total energy
            icon: mdi:lightning-bolt
            grid_options:
              columns: full
          - type: history-graph
            title: Cost today over the day
            hours_to_show: 24
            entities:
              - entity: sensor.entfeuchter_cost_today
                name: Cost today
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Savings
            icon: mdi:piggy-bank
          - type: tile
            entity: sensor.entfeuchter_savings_today
            name: Today
            icon: mdi:calendar-today
          - type: tile
            entity: sensor.entfeuchter_savings_this_month
            name: This month
            icon: mdi:calendar-month
          - type: tile
            entity: sensor.entfeuchter_savings_this_year
            name: This year
            icon: mdi:calendar
          - type: tile
            entity: sensor.entfeuchter_total_savings
            name: Total
            icon: mdi:sigma
          - type: statistics-graph
            title: Savings per day
            entities:
              - entity: sensor.entfeuchter_total_savings
                name: Savings
            stat_types:
              - change
            period: day
            days_to_show: 30
            chart_type: bar
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Statistics
            icon: mdi:chart-bar
          - type: statistics-graph
            title: Costs per day
            entities:
              - entity: sensor.entfeuchter_total_cost
                name: Costs
            stat_types:
              - change
            period: day
            days_to_show: 30
            chart_type: bar
            grid_options:
              columns: full
          - type: statistics-graph
            title: Costs per month
            entities:
              - entity: sensor.entfeuchter_total_cost
                name: Costs
            stat_types:
              - change
            period: month
            days_to_show: 365
            chart_type: bar
            grid_options:
              columns: full
          - type: statistics-graph
            title: Energy per day
            entities:
              - entity: sensor.entfeuchter_total_energy
                name: Energy
            stat_types:
              - change
            period: day
            days_to_show: 30
            chart_type: bar
            grid_options:
              columns: full
